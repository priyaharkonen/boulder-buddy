<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Studentlist</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
   <div class="container">
	<div class="col-md-4">
		<h1>Routes</h1>	
	</div>
    <!-- TABLE -->
     <table>
        <!-- Columns -->
        <tr>
            <th>Color</th>
            <th>Wall</th>
            <th>Holds</th>
            <th>Grade</th>
            <th>Status</th>
        </tr>
        <!-- Contents -->
         <tr th:each = "route: ${routes}">
            <td th:text="${route.color}"></td>
            <td th:text="${route.wall}"></td>
            <td th:text="${route.holds}"></td>
            <td th:text="${route.grade}"></td>
            <td th:text="${route.status}"></td>
            <td th:text="${route.gym.name}"></td>
         </tr>

     </table>
 
</body>
</html>
