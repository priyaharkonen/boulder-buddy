<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Boulderlist</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <header class="header">

        <h1>BoulderBuddy</h1>

        <div class="header-user">
            <p>Welcome, <span sec:authentication="name">Username</span>!</p>

            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Sign Out" class="action-button" id="sign-out">
            </form>
        </div>

    </header>

    <nav class="navigation">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/gyms}">Gyms</a>
        <a th:href="@{/boulders}" id="selected">Boulders</a>
        <a th:href="@{/logbook}">Logbook</a>
    </nav>

    <div>

        <h1 class="page-title"> Boulders </h1>

        <!-- TABLE -->
        <table class="table">

            <!-- table-columns -->
            <tr>
                <th>Route</th>
                <th>Gym</th>
                <th>Status</th>
                <th>Wall type</th>
                <th>Holds</th>
                <th sec:authorize="hasAuthority('ADMIN')"> Options</th>
                <!-- <th sec:authorize="hasAuthority('USER')"> Log</th> -->

            </tr>
            <!-- table-contents -->
            <tr th:each="boulder: ${boulders}">
                <td th:text="${boulder.color} + ' ' + ${boulder.grade}"></td>
                <td th:text="${boulder.gym.company} + ' ' + ${boulder.gym.location}"></td>
                <td th:text="${boulder.status}"></td>
                <td th:text="${boulder.wall}"></td>
                <td th:text="${boulder.holds}"></td>
                <td sec:authorize="hasAuthority('ADMIN')" id="options">
                    <a th:href="@{/delete/{id}(id=${boulder.boulderId})}" class="action-button" id="delete">&#10008; Remove</a>
                    <a th:href="@{/edit/{id}(id=${boulder.boulderId})}" class="action-button" id="edit">&#9998; Edit</a>
                </td>
<!--                 <td sec:authorize="hasAuthority('USER')">
                    <a th:href="@{/addlogtest/{id}(id=${boulder.boulderId})}" class="action-button" id="add">&#10010; Log this boulder</a>
                </td> -->
            </tr>
        </table>
        <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/add}" class="action-button" id="add">&#10010; Add Boulder</a>
        <a sec:authorize="hasAuthority('USER')" th:href="@{/addlog}" class="action-button" id="add">&#10010; Add Log</a>
    </div>

</body>

</html>
