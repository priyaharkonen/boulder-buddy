<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Boulderlist</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
   <div class="container">
	<div class="col-md-4">
		<h1>Boudlers</h1>	
	</div>
    <!-- TABLE -->
     <table>
        <!-- Columns -->
        <tr>
            <th>Color</th>
            <th>Wall</th>
            <th>Holds</th>
            <th>Grade</th>
            <th>Status</th>
        </tr>
        <!-- Contents -->
         <tr th:each = "boulder: ${boulders}">
            <td th:text="${boulder.color}"></td>
            <td th:text="${boulder.wall}"></td>
            <td th:text="${boulder.holds}"></td>
            <td th:text="${boulder.grade}"></td>
            <td th:text="${boulder.status}"></td>
            <td th:text="${boulder.gym.name}"></td>
         </tr>

     </table>
 
</body>
</html>
