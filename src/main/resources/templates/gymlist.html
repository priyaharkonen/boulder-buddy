<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Boulderlist</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <header class="header">

        <h1>BoulderBuddy</h1>

        <div class="header-user">
            <p>Welcome, <span sec:authentication="name">Username</span>!</p>

            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Sign Out" class="action-button" id="sign-out">
            </form>
        </div>

    </header>

    <nav class="navigation">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/gyms}" id="selected">Gyms</a>
        <a th:href="@{/boulders}">Boulders</a>
        <a th:href="@{/logbook}">Logbook</a>
    </nav>

    <div>

        <h1 class="page-title"> Gyms </h1>

        <!-- TABLE -->
        <table class="table">

            <!-- table-columns -->
            <tr>
                <th>Company</th>
                <th>Location</th>
                <th>Opening Hours</th>
                <th sec:authorize="hasAuthority('ADMIN')"> Options</th>
            </tr>
            <!-- table-contents -->
            <tr th:each="gym: ${gyms}">
                <td th:text="${gym.company}"></td>
                <td>
                    <span th:text="${gym.location}"></span><br>
                </td>
                <td>
                    Monday to Friday: <span th:text="${gym.weekOpening}"></span><br>
                    Saturday and Sunday: <span th:text="${gym.weekEndOpening}"></span>
                </td>
                <td sec:authorize="hasAuthority('ADMIN')" id="options">
                    <a th:href="@{/deletegym/{id}(id=${gym.gymId})}" class="action-button" id="delete">&#10008; Remove</a>
                    <a th:href="@{/editgym/{id}(id=${gym.gymId})}" class="action-button" id="edit">&#9998; Modify</a>
                </td>
            </tr>
        </table>
        <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/addgym}" class="action-button" id="add">&#10010; Add Gym</a>
    </div>

</body>

</html>
