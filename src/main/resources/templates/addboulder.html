<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Boulderlist</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <header class="header">

        <h1>BoulderBuddy</h1>

        <div class="header-user">
            <p>Welcome, <span sec:authentication="name">Username</span>!</p>

            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Sign Out" class="action-button" id="sign-out">
            </form>
        </div>

    </header>

    <nav class="navigation">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/gyms}">Gyms</a>
        <a th:href="@{/boulders}" id="selected">Boulders</a>
        <a th:href="@{/logbook}">Logbook</a>
    </nav>

    <div>
        <h1 class="page-title"> Add Boulder</h1>
        <!-- FORM -->
        <form th:object="${boulder}" th:action="@{/save}" method="post" class="form">

            <div class="form-section">
                <h2 class="section-title">Route Details</h2>

                <div class="form-row">

                    <div class="form-field">
                        <label for="color">Color</label>
                        <input type="text" th:field="*{color}" placeholder="e.g Blue">
                    </div>

                    <div class="form-field">
                        <label for="grade">Grade</label>
                        <input type="text" th:field="*{grade}" placeholder="e.g 6C+">
                    </div>

                    <div class="form-field">
                        <label for="status">Status</label>
                        <input type="text" th:field="*{status}" placeholder=" e.g Available">
                    </div>
                </div>

                <div id="secondary">
                    <h3>Additonal details</h3>

                    <div class="form-row">

                        <div class="form-field">
                            <label for="wall">Wall type</label>
                            <input type="text" th:field="*{wall}" placeholder="e.g Slab">
                        </div>

                        <div class="form-field">
                            <label for="holds">Holds</label>
                            <input type="text" th:field="*{holds}" placeholder="e.g Crimps and Pockets">
                        </div>

                    </div>

                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">Gym Details</h2>

                <div class="form-field">

                    <label for="gymList">Gym</label>
                    <select id="gymList" th:field="*{gym}" class="form-control" required>
                        <option value="">Select a gym</option>
                        <option th:each="gym: ${gyms}" th:value="${gym.gymId}"
                            th:text="${gym.company} + ' ' + ${gym.location}">
                        </option>
                    </select>

                </div>
            </div>
            <div class="button-row">
                <button type="submit" class="action-button" id="submit">Save</button>
                <a th:href="@{/boulders}" class="action-button" id="back">&larr; Back</a>
            </div>

        </form>
    </div>
</body>

</html>
